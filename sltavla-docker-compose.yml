version: '3.8'
services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - proxy

  proxy:
    image: node:18-slim
    working_dir: /app
    volumes:
      - ./proxy.js:/app/proxy.js
    command: node proxy.js
