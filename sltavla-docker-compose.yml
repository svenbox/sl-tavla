services:
  # Webbservern (Frontend)
  web:
    container_name: sl-web
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      - proxy

  # Proxyn (Backend)
  proxy:
    container_name: sl-proxy
    image: node:18-slim
    working_dir: /app
    volumes:
      - ./proxy.js:/app/proxy.js
    command: node proxy.js
    restart: always
