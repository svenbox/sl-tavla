<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SL Avgångstavla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sl-blue: #005b99; --sl-red: #d4171e; --sl-green: #1d7a3a; --sl-orange: #e8830a; --bg: #121212; --text: #eee;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .top-bar { background: #000; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        #board-container { padding: 15px; max-width: 800px; margin: 0 auto; }
        .dep-row { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #2a2a2a; background: #1e1e1e; margin-bottom: 2px; border-radius: 4px; }
        .dep-line { width: 45px; height: 28px; color: white; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 900; font-size: 0.9rem; flex-shrink: 0; }
        .dep-dest { flex: 1; margin: 0 15px; font-weight: 600; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dep-time { font-weight: 900; color: var(--sl-orange); min-width: 70px; text-align: right; }
        .canceled { text-decoration: line-through; opacity: 0.4; }
    </style>
</head>
<body>

<div class="top-bar">
    <h1 style="font-size: 1.2rem; margin: 0;">SL LIVE</h1>
    <div id="status-dot" style="width: 10px; height: 10px; background: #1d7a3a; border-radius: 50%;"></div>
</div>

<div id="board-container">
    <p style="text-align:center; padding:20px; color:#666;">Hämtar avgångar...</p>
</div>

<script>
    // 1. Konfiguration
    const P = "/proxy?url=";
    const DEFAULT_SITE_ID = '9192'; // Ändra till ditt föredragna SiteID (t.ex. 9192 för Slussen)

    // 2. Funktion för att hämta data
    async function fetchSLDeps(siteId) {
        // Vi hämtar 30 st för att vara säkra på att få med allt (Buss, Tåg, T-bana)
        const targetUrl = `https://transport.integration.sl.se/v1/sites/${siteId}/departures?limit=30`;
        try {
            const r = await fetch(P + encodeURIComponent(targetUrl));
            if (!r.ok) throw new Error("Proxy error");
            const d = await r.json();
            
            return (d.departures || []).map(x => ({
                line: x.line?.designation || '?',
                mode: x.line?.transport_mode,
                dest: x.destination || '–',
                time: x.expected || x.scheduled,
                state: x.state,
                deviations: x.deviations || []
            }));
        } catch (e) {
            console.error("Hämtningsfel:", e);
            return null;
        }
    }

    // 3. Hjälpfunktion för färger
    function getLineColor(line, mode) {
        if (mode === 'METRO') {
            if (['10','11'].includes(line)) return '#005b99';
            if (['13','14'].includes(line)) return '#d4171e';
            if (['17','18','19'].includes(line)) return '#1d7a3a';
        }
        if (mode === 'BUS') return '#d4171e';
        if (mode === 'TRAIN') return '#e8830a';
        if (mode === 'SHIP') return '#00b4e5';
        return '#444';
    }

    // 4. Formatera tid
    function formatTime(iso) {
        const diff = Math.round((new Date(iso) - new Date()) / 60000);
        if (diff <= 0) return 'Nu';
        if (diff > 25) {
            const d = new Date(iso);
            return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }
        return diff + ' min';
    }

    // 5. Huvudfunktion för att rita tavlan
    async function updateBoard() {
        const container = document.getElementById('board-container');
        const data = await fetchSLDeps(DEFAULT_SITE_ID);

        if (!data) {
            // Visa felmeddelande om vi inte får kontakt med proxyn
            document.getElementById('status-dot').style.background = 'red';
            return;
        }

        document.getElementById('status-dot').style.background = '#1d7a3a';

        // Filtrera bort färjor om du vill (valfritt, kommentera bort nästa rad för att se ALLT)
        // const filtered = data.filter(d => d.mode !== 'SHIP'); 
        const filtered = data; 

        if (filtered.length === 0) {
            container.innerHTML = "<p style='text-align:center;'>Inga avgångar hittades.</p>";
            return;
        }

        container.innerHTML = filtered.slice(0, 12).map(d => {
            const color = getLineColor(d.line, d.mode);
            const isCanceled = d.state === 'CANCELLED';
            return `
                <div class="dep-row">
                    <div class="dep-line" style="background:${color}">${d.line}</div>
                    <div class="dep-dest ${isCanceled ? 'canceled' : ''}">
                        ${d.dest} ${d.deviations.length > 0 ? '⚠️' : ''}
                    </div>
                    <div class="dep-time">${isCanceled ? 'Inställd' : formatTime(d.time)}</div>
                </div>
            `;
        }).join('');
    }

    // 6. Starta och sätt interval
    updateBoard();
    setInterval(updateBoard, 30000);

    // En tom showView för att undvika felmeddelanden om knappar finns kvar i HTML
    function showView(view) { console.log("Byter vy till:", view); }
</script>

</body>
</html>
