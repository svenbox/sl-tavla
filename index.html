<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SL LIVE FIX</title>
    <style>
        body { background: #000; color: #eee; font-family: sans-serif; padding: 20px; }
        .log { background: #111; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 0.7rem; color: #0f0; margin-bottom: 20px; max-height: 100px; overflow: auto; }
        input { width: 100%; padding: 15px; background: #222; color: #fff; border: 1px solid #444; font-size: 1.1rem; }
        .res { background: #2a2a2a; padding: 15px; margin-top: 5px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; }
        .res:hover { background: #333; border: 1px solid var(--sl-blue); }
        .type-tag { font-size: 0.7rem; background: #444; padding: 2px 6px; border-radius: 3px; }
        .row { display: flex; background: #1a1a1a; padding: 12px; border-bottom: 1px solid #333; align-items: center; margin-top: 2px; }
        .line { background: #d4171e; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-right: 15px; min-width: 35px; text-align: center; }
        .dest { flex: 1; font-weight: bold; }
        .time { color: #e8830a; font-weight: bold; }
    </style>
</head>
<body>

    <h3>1. SÖK STATION</h3>
    <input type="text" id="sok" placeholder="Skriv t.ex. Slussen...">
    <div id="sok-resultat"></div>

    <div id="logg" class="log">Redo.</div>

    <h2 id="valda-namn"></h2>
    <div id="tavla"></div>

<script>
    const P = "/proxy?url=";

    function log(msg) {
        const l = document.getElementById('logg');
        l.innerHTML = "> " + msg + "<br>" + l.innerHTML;
    }

    // SÖK-FUNKTION
    document.getElementById('sok').oninput = async (e) => {
        const v = e.target.value;
        if(v.length < 3) return;
        
        // Här lägger vi till "stop" för att slippa se 6000 enskilda stolpar
        const searchUrl = `https://transport.integration.sl.se/v1/sites?search-term=${encodeURIComponent(v)}&content-type=stop&max-results=10`;
        
        try {
            const r = await fetch(P + encodeURIComponent(searchUrl));
            const data = await r.json();
            
            log("Hittade " + data.length + " stationer.");
            
            document.getElementById('sok-resultat').innerHTML = data.map(s => `
                <div class="res" onclick="valj('${s.id}', '${s.name}')">
                    <span>${s.name}</span>
                    <span class="type-tag">ID: ${s.id}</span>
                </div>
            `).join('');
        } catch(e) { log("SÖKFEL: " + e.message); }
    };

    async function valj(id, namn) {
        document.getElementById('valda-namn').innerText = namn;
        document.getElementById('sok-resultat').innerHTML = "";
        log("Hämtar avgångar för " + namn + " (" + id + ")...");
        
        // Vi hämtar 80 rader för att vara säkra
        const depUrl = `https://transport.integration.sl.se/v1/sites/${id}/departures?limit=80`;
        
        try {
            const r = await fetch(P + encodeURIComponent(depUrl));
            const d = await r.json();
            
            // FILTRERA BORT SHIP (Färjor)
            const filter = (d.departures || []).filter(x => x.line.transport_mode !== 'SHIP');
            
            log("Hittade " + d.departures.length + " rader, " + filter.length + " är buss/tåg.");

            if(filter.length === 0) {
                document.getElementById('tavla').innerHTML = "<p>Inga bussar/tåg hittades på detta ID. Testa en annan träff i sökningen.</p>";
                return;
            }

            document.getElementById('tavla').innerHTML = filter.slice(0, 15).map(x => `
                <div class="row">
                    <span class="line" style="background:${getCol(x)}">${x.line.designation}</span>
                    <span class="dest">${x.destination}</span>
                    <span class="time">${x.display}</span>
                </div>
            `).join('');

        } catch(e) { log("FEL: " + e.message); }
    }

    function getCol(x) {
        const m = x.line.transport_mode;
        const n = x.line.designation;
        if(m === 'BUS') return '#d4171e';
        if(m === 'TRAIN') return '#e8830a';
        if(m === 'METRO') {
            if(['10','11'].includes(n)) return '#005b99';
            if(['13','14'].includes(n)) return '#d4171e';
            return '#1d7a3a';
        }
        return '#444';
    }
</script>
</body>
</html>
