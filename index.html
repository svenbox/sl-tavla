<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SL DEBUG MODE</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .log { border: 1px solid #333; padding: 10px; margin-bottom: 20px; font-size: 0.8rem; color: #aaa; }
        .row { display: flex; background: #111; padding: 10px; border-bottom: 1px solid #222; }
        .line { color: #fff; background: #d4171e; padding: 2px 6px; margin-right: 10px; }
        input { width: 100%; padding: 10px; background: #222; color: #fff; border: 1px solid #444; }
        .res { padding: 10px; cursor: pointer; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <h2>1. SÖK HÅLLPLATS</h2>
    <input type="text" id="sok" placeholder="Skriv station...">
    <div id="sok-resultat"></div>

    <h2>2. STATUS LOGG</h2>
    <div id="logg" class="log">Väntar på input...</div>

    <h2>3. AVGÅNGAR (Endast Buss/Tåg/T-bana)</h2>
    <div id="tavla"></div>

<script>
    const P = "/proxy?url=";

    // Logga händelser till skärmen så vi ser vad som händer
    function log(msg) {
        document.getElementById('logg').innerHTML += ">< " + msg + "<br>";
        console.log(msg);
    }

    // SÖK-FUNKTION
    document.getElementById('sok').oninput = async (e) => {
        const v = e.target.value;
        if(v.length < 3) return;
        
        log("Söker efter: " + v);
        try {
            const r = await fetch(P + encodeURIComponent("https://transport.integration.sl.se/v1/sites?search-term=" + v));
            const data = await r.json();
            log("Sökning klar, hittade " + data.length + " platser");
            
            document.getElementById('sok-resultat').innerHTML = data.slice(0,5).map(s => `
                <div class="res" onclick="valj('${s.id}', '${s.name}')">KLICKA HÄR: ${s.name} (ID: ${s.id})</div>
            `).join('');
        } catch(e) { log("SÖKFEL: " + e.message); }
    };

    // NÄR MAN KLICKAR PÅ EN HÅLLPLATS
    async function valj(id, namn) {
        log("Valde: " + namn + " ID: " + id);
        if(!id || id === 'undefined') {
            log("FEL: ID är undefined!");
            return;
        }
        
        const url = `https://transport.integration.sl.se/v1/sites/${id}/departures?limit=50`;
        log("Hämtar avgångar från: " + url);
        
        try {
            const r = await fetch(P + encodeURIComponent(url));
            if(!r.ok) { log("SERVER-FEL: " + r.status); return; }
            
            const d = await r.json();
            log("Data mottagen. Totalt " + (d.departures ? d.departures.length : 0) + " rader.");

            // Filtrera bort SHIP
            const filter = (d.departures || []).filter(x => x.line.transport_mode !== 'SHIP');
            log("Efter filter (bort med färjor): " + filter.length + " rader kvar.");

            if(filter.length === 0) {
                document.getElementById('tavla').innerHTML = "Hittade inga bussar/tåg på detta ID.";
                return;
            }

            document.getElementById('tavla').innerHTML = filter.map(x => `
                <div class="row">
                    <span class="line">${x.line.designation}</span>
                    <span style="flex:1">${x.destination}</span>
                    <span style="color:orange">${x.display}</span>
                </div>
            `).join('');

        } catch(e) { log("HÄMTNINGSFEL: " + e.message); }
    }
</script>
</body>
</html>
