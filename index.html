<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL TEST</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .debug-info { color: #888; font-size: 0.8rem; margin-bottom: 10px; border: 1px solid #333; padding: 5px; }
        .dep-row { display: flex; padding: 10px; border-bottom: 1px solid #222; align-items: center; }
        .line { background: #d4171e; padding: 5px 10px; border-radius: 4px; font-weight: bold; margin-right: 15px; min-width: 40px; text-align: center; }
        .dest { flex: 1; }
        .time { color: #e8830a; font-weight: bold; }
        .search-res { background: #222; cursor: pointer; padding: 10px; margin-top: 5px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>SL LIVE DEBUG</h2>
    <input type="text" id="inp" placeholder="Sök station..." style="width:100%; padding:10px;">
    <div id="results"></div>
    <hr>
    <div id="board"></div>

<script>
    const P = "/proxy?url=";
    let boards = JSON.parse(localStorage.getItem('sl_boards') || '[]');

    async function doSearch(q) {
        if(q.length < 3) return;
        const res = await fetch(P + encodeURIComponent("https://transport.integration.sl.se/v1/sites?search-term=" + q));
        const data = await res.json();
        document.getElementById('results').innerHTML = data.slice(0,5).map(s => `
            <div class="search-res" onclick="add('${s.id}', '${s.name}')">${s.name} (ID: ${s.id})</div>
        `).join('');
    }

    document.getElementById('inp').oninput = (e) => doSearch(e.target.value);

    function add(id, name) {
        boards = [{id, name}]; // Vi sparar bara EN för att testa
        localStorage.setItem('sl_boards', JSON.stringify(boards));
        location.reload();
    }

    async function load() {
        if(boards.length === 0) return;
        const b = boards[0];
        // VIKTIGT: Vi hämtar MÄNGDER av rader
        const res = await fetch(P + encodeURIComponent(`https://transport.integration.sl.se/v1/sites/${b.id}/departures?limit=100`));
        const data = await res.json();
        
        const allModes = data.departures.map(d => d.line.transport_mode);
        const uniqueModes = [...new Set(allModes)];
        
        let html = `<div class="debug-info">Hittade: ${uniqueModes.join(', ')} (${data.departures.length} rader)</div>`;
        
        // Hård filtrering: ENDAST METRO OCH BUS
        const filtered = data.departures.filter(d => d.line.transport_mode === 'BUS' || d.line.transport_mode === 'METRO' || d.line.transport_mode === 'TRAIN');

        if(filtered.length === 0) {
            html += "<p>Hittade INGA bussar/tåg i de 100 senaste raderna för detta ID.</p>";
        } else {
            html += filtered.slice(0,15).map(d => `
                <div class="dep-row">
                    <div class="line">${d.line.designation}</div>
                    <div class="dest">${d.destination}</div>
                    <div class="time">${d.display || 'Tid saknas'}</div>
                </div>
            `).join('');
        }
        document.getElementById('board').innerHTML = html;
    }

    load();
</script>
</body>
</html>
