services:
  sl-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sl-frontend
    restart: unless-stopped
    ports:
      - "8087:80"
    depends_on:
      - sl-proxy
    networks:
      - sl-net

  sl-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: sl-proxy
    restart: unless-stopped
    environment:
      - TL_API_KEY=${TL_API_KEY}
    networks:
      - sl-net

networks:
  sl-net:
    name: sl-net
    driver: bridge
