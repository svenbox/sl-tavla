server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Denna del sköter kontakten med din proxy-container
    location /proxy {
        proxy_pass http://proxy:3000; # "proxy" måste matcha tjänstenamnet i din yml-fil
        proxy_http_version 1.1;
    }
}
